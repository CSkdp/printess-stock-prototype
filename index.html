                window.addEventListener("message", async (event) => {
                    if (!event.data || event.data.type !== "stock-image-selected") return;

                    const imageUrl = event.data.url;

                    printess.ui.showProgressOverlay("Importing Image...");

                    await printess.api.importImageFromUrl(imageUrl, true);

                    printess.api.clearSelection();
                    printess.ui.hideProgressOverlay();
                    printess.ui.closeDialog();

                }, { once: true });
            },

            color: "primary",
