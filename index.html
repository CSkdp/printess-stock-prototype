<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Printess + Stock Picker (Popup Version)</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
    }

    #printess-editor {
        width: 100vw;
        height: 100vh;
    }
</style>
</head>

<body>

<div id="printess-editor"></div>

<script type="module">
/* Load Printess */
const printessLoader = await import("https://editor.printess.com/printess-editor/loader.js");

const printess = await printessLoader.load({

    /* 🔥 Replace with your token */
    token: "YOUR_TOKEN_HERE",

    templateName: "Blank Circle",
    templateVersion: "draft",
    host: document.getElementById("printess-editor"),
    basketId: "demo-basket-123",

    buttons: [
        {
            label: "Stock Images",
            location: "image-upload",
            clickCallback: () => {

                // Open a popup window with your GitHub-hosted picker page
                const pickerWindow = window.open(
                    "https://cskdp.github.io/printess-stock-prototype/stock-picker.html",
                    "stockpicker",
                    "width=900,height=700"
                );

                // Listen for a message from the child window
                const listener = async (event) => {
                    if (!event.data) return;

                    if (event.data.type === "stock-image-selected") {

                        printess.ui.showProgressOverlay("Importing Image...");

                        // Import stock image into Printess
                        await printess.api.importImageFromUrl(event.data.url, true);

                        printess.api.clearSelection();
                        printess.ui.hideProgressOverlay();

                        // Close picker window
                        pickerWindow.close();

                        // Remove listener so it doesn't fire multiple times
                        window.removeEventListener("message", listener);
                    }
                };

                window.addEventListener("message", listener);
            }
        }
    ]
});
</script>

</body>
</html>
