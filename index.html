                const pickerWindow = window.open(
                    "https://cskdp.github.io/printess-stock-prototype/stock-picker.html",
                    "stockpicker",
                    "width=900,height=700,toolbar=no,location=no,menubar=no,status=no,resizable=yes,scrollbars=yes"
                );

                // LISTEN FOR IMAGE SELECTION
                const listener = async (event) => {
                    if (!event.data) return;

                    if (event.data.type === "stock-image-selected") {

                        printess.ui.showProgressOverlay("Importing Image...");

                        // Import selected image
                        await printess.api.importImageFromUrl(event.data.url, true);

                        printess.api.clearSelection();
                        printess.ui.hideProgressOverlay();

                        // Close the popup
                        pickerWindow.close();

                        // Remove listener
                        window.removeEventListener("message", listener);
                    }
                };

                window.addEventListener("message", listener);
            }
        }
    ]
});
